# Copiar a .github/workflows/evergreen-import.yml en cada blog, junto con scripts/evergreen-import.mjs.
# Requiere el secret EVERGREEN_FEED_URL (Settings → Secrets and variables → Actions) con la URL que
# muestra el dashboard en Ajustes → Publicación.
name: Import EvergreenSEO feed

on:
  schedule:
    - cron: "17 * * * *" # cada hora (GitHub puede retrasarlo en horas pico)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: evergreen-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import posts
        env:
          EVERGREEN_FEED_URL: ${{ secrets.EVERGREEN_FEED_URL }}
        run: node scripts/evergreen-import.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin posts nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import post(s) from EvergreenSEO"
          git push
